# general
set -g mouse on
set-window-option -g mode-keys vi

# key bindings
bind -n S-Left previous-window
bind -n S-Right next-window
bind c new-window -a -c "#{pane_current_path}"

# preferences
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g status-position top
set -g status-style bg=default,fg=brightyellow
setw -g window-status-style fg=brightblack,bg=default
setw -g window-status-format ' #I:#W '
setw -g window-status-current-style fg=brightgreen,bg=default,bold
setw -g window-status-current-format ' #I:#W '
set -g status-left ""
set -g status-right '#[fg=brightblack,bg=default]%m-%d %H:%M'
set -g status-right-length 20
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightblack

# plugins
set -g @resurrect-strategy-nvim 'session'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
